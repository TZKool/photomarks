name: iOS Snapshots

on:
  workflow_dispatch:

jobs:
  snapshots:
    name: Render watermark snapshots
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Render snapshots
        working-directory: ios
        run: |
          xcodebuild test \
            -project TraceMark.xcodeproj \
            -scheme TraceMark \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build-test \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export attachments
        if: always()
        working-directory: ios
        run: |
          mkdir -p snapshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path snapshots || true
          ls -la snapshots

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-watermark-snapshots
          path: ios/snapshots
          if-no-files-found: warn
          retention-days: 7
