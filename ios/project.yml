name: TraceMark
options:
  bundleIdPrefix: com.tzkool
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  TraceMark:
    type: application
    platform: iOS
    sources:
      - path: TraceMark
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tzkool.tracemark
        PRODUCT_NAME: TraceMark
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: TraceMark/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
    info:
      path: TraceMark/Info.plist
      properties:
        CFBundleDisplayName: 迹印相机
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 用于读取您选择的照片及其 EXIF 拍摄信息（含经纬度）。
        NSPhotoLibraryAddUsageDescription: 用于将添加水印后的照片保存到您的相册。
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
  TraceMarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TraceMarkTests
    dependencies:
      - target: TraceMark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tzkool.tracemark.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TraceMark.app/TraceMark"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TraceMark:
    build:
      targets:
        TraceMark: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TraceMarkTests
    archive:
      config: Release
